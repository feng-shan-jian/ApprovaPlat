server {
    # 明文入口只负责跳转 HTTPS；域名和证书路径由发布流程通过 envsubst 注入。
    listen 80;
    listen [::]:80;
    server_name ${RUOYI_SERVER_NAME};

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${RUOYI_SERVER_NAME};

    ssl_certificate ${RUOYI_TLS_CERTIFICATE};
    ssl_certificate_key ${RUOYI_TLS_CERTIFICATE_KEY};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RUOYI_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/lib/ruoyi/current/frontend;
    index index.html;
    client_max_body_size 55m;
    gzip_static on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 禁止通过前端代理访问数据库连接池管理控制台。
    location ^~ /prod-api/druid/ {
        return 404;
    }

    # 即使后端配置发生漂移，也不允许通过生产代理访问 OpenAPI 或 Swagger UI。
    location ^~ /prod-api/v3/api-docs {
        return 404;
    }

    location ^~ /prod-api/swagger-ui {
        return 404;
    }

    # 管理端点只允许从独立回环端口采集，任何业务代理路径均显式拒绝。
    location = /prod-api/actuator {
        return 404;
    }

    location ^~ /prod-api/actuator/ {
        return 404;
    }

    # 生产前端使用 /prod-api 前缀，转发时去掉该前缀后访问 Java 服务。
    location /prod-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /prod-api {
        return 301 /prod-api/;
    }

    # 生产健康检查使用后端首页，不依赖已经关闭的 API 文档端点。
    location ^~ /v3/api-docs {
        return 404;
    }

    location ^~ /swagger-ui {
        return 404;
    }

    # Vue Router 使用 history 模式，未知路径回退到应用入口。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
