# 项目相关配置
ruoyi:
  # 名称
  name: ApprovaPlat
  # 版本
  version: 0.1.0
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（Windows 配置 D:/approvaplat/uploadPath，Linux 配置 /var/lib/approvaplat/uploadPath）
  profile: D:/approvaplat/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 默认环境只启用基础健康端点；生产 Prometheus 和分组探针由受控部署覆盖配置开启。
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # SMTP 凭据只允许由部署环境或正式密钥注入；未配置时邮件 outbox 会进入可补偿死信。
  mail:
    host: ${APPROVAPLAT_SMTP_HOST:}
    port: ${APPROVAPLAT_SMTP_PORT:587}
    username: ${APPROVAPLAT_SMTP_USERNAME:}
    password: ${APPROVAPLAT_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${APPROVAPLAT_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${APPROVAPLAT_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: ${APPROVAPLAT_SMTP_CONNECT_TIMEOUT:5000}
      mail.smtp.timeout: ${APPROVAPLAT_SMTP_READ_TIMEOUT:10000}
      mail.smtp.writetimeout: ${APPROVAPLAT_SMTP_WRITE_TIMEOUT:10000}
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 与工作流单文件 50 MiB 业务门禁保持完全一致。
      max-file-size: 52428800B
      # 为 multipart 边界、字段名和请求头预留 5 MiB，不放宽单文件限制。
      max-request-size: 57671680B
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 显式环境密钥优先；未提供时由下方持久化文件自动生成并稳定复用。
  secret: ${RUOYI_TOKEN_SECRET:}
  secret-file:
    # 开源默认配置允许零手工步骤启动，同时不会在源码或构建产物中写入真实密钥。
    enabled: ${RUOYI_TOKEN_SECRET_FILE_ENABLED:true}
    # 开发环境默认写入当前用户私有目录，可通过环境变量改到受控持久化卷。
    path: ${RUOYI_TOKEN_SECRET_FILE:${user.home}/.approvaplat/token-secret}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Flowable 流程引擎配置
flowable:
  # 所有环境都由正式 SQL 管理 schema，应用启动不得自动改表。
  database-schema-update: "false"
  check-process-definitions: false
  rest-api-enabled: false
  # 初始切换阶段关闭执行器；完成 job 盘点和容量测试后再由部署配置启用。
  async-executor-activate: false
  async-history-executor-activate: false
  history-level: full
  # Flowable 变量与 Spring Boot 4 统一使用 Jackson 3，禁止重新引入已弃用的 Jackson 2 mapper。
  variable-json-mapper: jackson
  db-identity-used: false
  idm:
    enabled: false
  eventregistry:
    enabled: false
  process:
    enable-safe-xml: true
  attachment:
    # 单文件、用户 TEMP、全局未删除容量和磁盘低水位均在数据库 guard 行锁内校验。
    max-size: 52428800
    max-temporary-count: 100
    max-temporary-bytes: 536870912
    max-total-bytes: 53687091200
    min-free-bytes: 1073741824
  notification:
    worker-enabled: ${APPROVAPLAT_NOTIFICATION_WORKER_ENABLED:true}
    batch-size: ${APPROVAPLAT_NOTIFICATION_BATCH_SIZE:50}
    lease-duration: ${APPROVAPLAT_NOTIFICATION_LEASE_DURATION:2m}
    max-retry-delay: ${APPROVAPLAT_NOTIFICATION_MAX_RETRY_DELAY:30m}
    urge-interval: ${APPROVAPLAT_NOTIFICATION_URGE_INTERVAL:5m}
    worker-delay: ${APPROVAPLAT_NOTIFICATION_WORKER_DELAY:1000}
    # 只保存公开 From 地址；SMTP 用户名和密码位于上方 spring.mail 环境配置。
    mail-from: ${APPROVAPLAT_NOTIFICATION_MAIL_FROM:}

# OpenAPI 文档配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '全部接口'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
